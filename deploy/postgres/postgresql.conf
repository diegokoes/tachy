# Postgres for the 16 GB office laptop (DEPLOYMENT-ARCHITECTURE.md §5.9).
# Starting points; tune from pg_stat_statements. Mounted by compose.prod.yml
# and passed as `-c config_file=`, so it replaces the image's file entirely.

listen_addresses = '*'
max_connections = 100

shared_buffers = 1GB
effective_cache_size = 4GB
maintenance_work_mem = 512MB
work_mem = 16MB
random_page_cost = 1.1

wal_compression = on
max_wal_size = 2GB

shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 500ms
idle_in_transaction_session_timeout = 60s

log_timezone = 'UTC'
timezone = 'UTC'
