- name: The operator running this stays able to log in after AllowGroups
  ansible.builtin.assert:
    that: ansible_user in (admin_users | map(attribute='name') | list)
    fail_msg: "{{ ansible_user }} is not in admin_users; SSH would lock it out"

- name: Groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
  loop: [tachy-admins, tachy-backup]

- name: Admin users, key-only, with sudo
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: [tachy-admins, sudo]
    append: true
    shell: /bin/bash
  loop: "{{ admin_users }}"

- name: Admin SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_pubkey }}"
  loop: "{{ admin_users }}"

- name: The tachy user may log in (the docker group comes with Docker)
  ansible.builtin.user:
    name: "{{ tachy_user }}"
    groups: [tachy-admins]
    append: true
    shell: /bin/bash
    create_home: true

- name: SSH hardening
  ansible.builtin.template:
    src: templates/sshd-tachy.conf.j2
    dest: /etc/ssh/sshd_config.d/10-tachy.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
