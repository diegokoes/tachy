# Two layers, because Docker-published ports never pass the host's input
# chain: nftables guards SSH on the host, and a DOCKER-USER chain guards
# Caddy's 80 and 443.
- name: Host firewall for SSH (does not flush the ruleset Docker also uses)
  ansible.builtin.template:
    src: templates/nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
    validate: nft -c -f %s
  notify: Reload nftables

- name: Nftables is enabled
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Library directory for host scripts
  ansible.builtin.file:
    path: "{{ tachy_lib }}/host"
    state: directory
    mode: "0755"

- name: Edge rules script
  ansible.builtin.template:
    src: templates/tachy-edge.sh.j2
    dest: "{{ tachy_lib }}/host/tachy-edge.sh"
    mode: "0755"
  notify: Apply edge rules

- name: Edge rules re-applied whenever Docker starts
  ansible.builtin.copy:
    dest: /etc/systemd/system/tachy-edge.service
    content: |
      [Unit]
      Description=Restrict published container ports to the LAN
      After=docker.service
      PartOf=docker.service
      [Service]
      Type=oneshot
      RemainAfterExit=true
      ExecStart={{ tachy_lib }}/host/tachy-edge.sh
      [Install]
      WantedBy=docker.service
    mode: "0644"
  notify: [Reload systemd, Apply edge rules]

- name: Edge rules are enabled
  ansible.builtin.systemd_service:
    name: tachy-edge
    enabled: true
    daemon_reload: true
