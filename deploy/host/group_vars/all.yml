# Defaults for deploy/host/playbook.yml, under what /etc/tachy/host.yml sets.
# They live here and not in the play's `vars:` because play vars outrank an
# inventory: there, these empty lists replace its admin_users and lan_cidrs.
tachy_user: tachy
tachy_repo: "https://github.com/diegokoes/tachy.git"
# laptop: battery, lid and mDNS are looked after. server: none of them exist.
host_profile: laptop
mdns_enabled: "{{ host_profile == 'laptop' }}"
# The commit the playbook runs from, which tachy-install passes.
host_commit: ""
tachy_dir: /opt/tachy
tachy_srv: /srv/tachy
tachy_lib: /usr/local/lib/tachy
lan_cidrs: []
ssh_allowed_cidrs: []
admin_users: []
backup_downloaders: []
backup_recipients: []
tailscale_enabled: false
tailscale_cidr: "100.64.0.0/10"
docker_major: "29"
# CI's image gates install the same release from these two lines.
gvisor_release: "20261026.0"
gvisor_sha512: "e6aa030fb8379fe92b53e9b8b696419e0dce8a3bbcc7d4c1cf76b2ea3d6569eabd7360e694deda6ccbdcd77095b3e82ca0f90a3d8fd13a3e5d6b11cd29fe4649"
dns_probe_name: api.anthropic.com
dns_wait_seconds: 60
battery_stop_threshold: 80
battery_start_threshold: 75
