# Defaults for deploy/host/playbook.yml. They live here and not in the play's
# `vars:` because play vars outrank the inventory: there, the inventory's
# admin_users and lan_cidrs were replaced by these empty lists.
tachy_user: tachy
tachy_dir: /opt/tachy
tachy_srv: /srv/tachy
tachy_lib: /usr/local/lib/tachy
lan_cidrs: []
ssh_allowed_cidrs: []
admin_users: []
backup_downloaders: []
backup_recipients: []
tailscale_enabled: false
tailscale_cidr: "100.64.0.0/10"
docker_major: "29"
battery_stop_threshold: 80
battery_start_threshold: 75
