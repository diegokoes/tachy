# Provisions a tachy host (DEPLOYMENT-ARCHITECTURE.md §12). tachy-install runs
# it on the host itself, with /etc/tachy/host.yml as its variables.
# Idempotent: tachy-install runs it again after any change to that file.
- name: Tachy host
  hosts: all
  become: true
  # A run that fails late has still changed sshd, Docker and the firewall.
  force_handlers: true
  handlers:
    - name: Restart ssh
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald
        state: restarted
    # Ahead of Docker's: restarting docker leaves containerd running, on the
    # root it started with.
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
    - name: Restart docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
    - name: Reload nftables
      ansible.builtin.systemd_service:
        name: nftables
        state: reloaded
    - name: Apply edge rules
      ansible.builtin.systemd_service:
        name: tachy-edge
        state: restarted
    - name: Restart tlp
      ansible.builtin.systemd_service:
        name: tlp
        state: restarted
    - name: Restart upower
      ansible.builtin.systemd_service:
        name: upower
        state: restarted
  tasks:
    - name: Base system
      ansible.builtin.import_tasks: tasks/base.yml
    - name: Laptop as a server
      ansible.builtin.import_tasks: tasks/laptop.yml
      when: host_profile == 'laptop'
    - name: Users and SSH
      ansible.builtin.import_tasks: tasks/ssh.yml
    - name: Docker
      ansible.builtin.import_tasks: tasks/docker.yml
    - name: gVisor for the turn sandboxes
      ansible.builtin.import_tasks: tasks/gvisor.yml
    - name: Firewall
      ansible.builtin.import_tasks: tasks/firewall.yml
    - name: Backup downloads over SFTP
      ansible.builtin.import_tasks: tasks/backup-sftp.yml
    - name: Tachy scripts, directories and timers
      ansible.builtin.import_tasks: tasks/tachy.yml
