# Production overrides for the office laptop (DEPLOYMENT-ARCHITECTURE.md §4.3, §7).
#
#   docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d
#
# Needs in .env: TACHY_IMAGE and TACHY_SANDBOX_IMAGE (by digest),
# TACHY_DOCKER_GID, TACHY_HOSTNAME, POSTGRES_PASSWORD, TACHY_APP_DB_PASSWORD,
# TACHY_MCP_DB_PASSWORD, TACHY_BACKUP_DB_PASSWORD, plus the app secrets.
# tachy-deploy writes the first three.
#
# Every size below is a variable whose default fits the 16 GB laptop (§3.2):
# the memory limits sum to what that host has left after the OS. Another host
# sets its own in .env, and 0 lifts a memory or CPU limit. .env.example lists
# them.
#
# With TACHY_TLS=internal, the root clients must trust is exported with
#   docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt tachy-root.crt

x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "10"

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    container_name: ${COMPOSE_PROJECT_NAME:-tachy}-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      TACHY_HOSTNAME: ${TACHY_HOSTNAME:?set TACHY_HOSTNAME in .env}
      TACHY_HOST_IP: ${TACHY_HOST_IP:-}
      TACHY_DEFAULT_SNI: ${TACHY_HOST_IP:-${TACHY_HOSTNAME}}
      TACHY_TLS: ${TACHY_TLS:-internal}
      # Above the largest chat upload (TACHY_UPLOAD_MAX_MB), for the multipart
      # framing around it.
      TACHY_REQUEST_BODY_MAX: ${TACHY_REQUEST_BODY_MAX:-26MB}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TACHY_TLS_CERT_DIR:-./deploy/caddy/certs}:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: ${TACHY_CADDY_MEM_LIMIT:-256m}
    cpu_shares: 1024
    pids_limit: 256
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    logging: *logging

  api:
    depends_on:
      embedder:
        condition: service_healthy
      sandbox-launcher:
        condition: service_healthy
    ports: !reset []
    init: true
    environment:
      DATABASE_URL: postgres://tachy_app:${TACHY_APP_DB_PASSWORD:?set TACHY_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-tachy}
      TACHY_DRAIN_SECONDS: ${TACHY_DRAIN_SECONDS:-180}
      TACHY_STATUS_DIR: /status
      # Jobs run in worker-light and worker-heavy below, not in the api.
      TACHY_WORKER: external
      # The model runs in the embedder service below, not in the api.
      TACHY_EMBED_URL: http://embedder:8790/internal/embed
      TACHY_INTERNAL_SECRET: ${TACHY_INTERNAL_SECRET:?set TACHY_INTERNAL_SECRET (openssl rand -hex 32)}
      # The chat tools connect as tachy_mcp, which a model drives: no vault, no
      # API tokens, no password hashes (db/roles.sql).
      TACHY_MCP_DB_PASSWORD: ${TACHY_MCP_DB_PASSWORD:?set TACHY_MCP_DB_PASSWORD (openssl rand -hex 32)}
      # Caddy overwrites X-Forwarded-For, so it names the client here.
      TACHY_BEHIND_PROXY: "true"
      # Where people reach this server, for the links it writes into a ticket
      # note: the names Caddy answers to, unless .env says otherwise.
      TACHY_PUBLIC_ORIGINS: ${TACHY_PUBLIC_ORIGINS:-https://${TACHY_HOSTNAME}${TACHY_HOST_IP:+,https://${TACHY_HOST_IP}}}
      TACHY_DB_POOL_MAX: ${TACHY_API_DB_POOL_MAX:-15}
      # Chat turns at once, sized to mem_limit below (§3.2). A cap saved in
      # Admin › system wins over it.
      TACHY_AGENT_SLOT_CAP: ${TACHY_AGENT_SLOT_CAP:-12}
      TACHY_TURN_SANDBOX: ${TACHY_TURN_SANDBOX:-on}
      # Where a turn's tools reach this process from their own container.
      TACHY_INTERNAL_URL: http://api:8787/internal
    volumes:
      - ${TACHY_STATUS_HOST_DIR:-/srv/tachy/status}:/status:ro
      - tachy-sandbox-run:/run/tachy-sandbox:ro
    stop_grace_period: 210s
    mem_limit: ${TACHY_API_MEM_LIMIT:-5808m}
    cpu_shares: 2048
    pids_limit: ${TACHY_API_PIDS_LIMIT:-2048}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=512m
    logging: *logging

  # The one embedding model on the host (§5.4): queries first, passages in
  # small batches, background jobs' passages last.
  embedder:
    image: ${TACHY_IMAGE:-ghcr.io/diegokoes/tachy:main}
    container_name: ${COMPOSE_PROJECT_NAME:-tachy}-embedder
    restart: unless-stopped
    command: ["node", "dist/embedder.js"]
    init: true
    environment:
      NODE_ENV: production
      TACHY_INTERNAL_SECRET: ${TACHY_INTERNAL_SECRET:?set TACHY_INTERNAL_SECRET}
      TACHY_EMBED_THREADS: ${TACHY_EMBED_THREADS:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8790/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
    mem_limit: ${TACHY_EMBEDDER_MEM_LIMIT:-3700m}
    cpus: ${TACHY_EMBEDDER_CPUS:-6}
    cpu_shares: 2048
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    logging: *logging

  # Job pools (DEPLOYMENT-ARCHITECTURE.md §5.3.4). Each claims only runs of its
  # class; a heavy run holds 3 chat slots while it runs.
  worker-light: &worker
    image: ${TACHY_IMAGE:-ghcr.io/diegokoes/tachy:main}
    container_name: ${COMPOSE_PROJECT_NAME:-tachy}-worker-light
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgres://tachy_app:${TACHY_APP_DB_PASSWORD:?set TACHY_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-tachy}
      NODE_ENV: production
      TACHY_WORKER_CLASSES: light
      TACHY_EMBED_URL: http://embedder:8790/internal/embed
      TACHY_EMBED_PRIORITY: low
      TACHY_INTERNAL_SECRET: ${TACHY_INTERNAL_SECRET:?set TACHY_INTERNAL_SECRET}
      TACHY_WORKER_CONCURRENCY: ${TACHY_WORKER_LIGHT_CONCURRENCY:-4}
      TACHY_DB_APP_NAME: tachy-worker-light
      TACHY_DB_POOL_MAX: ${TACHY_WORKER_DB_POOL_MAX:-5}
      TACHY_DRAIN_SECONDS: "60"
      TACHY_TURN_SANDBOX: ${TACHY_TURN_SANDBOX:-on}
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-launcher:
        condition: service_healthy
    volumes:
      - tachy-repo-data:/app/data
      - tachy-agent-home:/home/node/.claude
      - tachy-sandbox-run:/run/tachy-sandbox:ro
    stop_grace_period: 90s
    mem_limit: ${TACHY_WORKER_LIGHT_MEM_LIMIT:-512m}
    cpus: ${TACHY_WORKER_LIGHT_CPUS:-1}
    cpu_shares: 512
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      disable: true
    logging: *logging

  worker-heavy:
    <<: *worker
    container_name: ${COMPOSE_PROJECT_NAME:-tachy}-worker-heavy
    environment:
      DATABASE_URL: postgres://tachy_app:${TACHY_APP_DB_PASSWORD:?set TACHY_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-tachy}
      NODE_ENV: production
      TACHY_WORKER_CLASSES: heavy
      # Load runs happen in the heavy pool; targets are named, never typed in.
      TACHY_LOAD_TARGETS: ${TACHY_LOAD_TARGETS:-production=http://api:8787}
      TACHY_EMBED_URL: http://embedder:8790/internal/embed
      TACHY_EMBED_PRIORITY: low
      TACHY_INTERNAL_SECRET: ${TACHY_INTERNAL_SECRET:?set TACHY_INTERNAL_SECRET}
      TACHY_WORKER_CONCURRENCY: ${TACHY_WORKER_HEAVY_CONCURRENCY:-1}
      TACHY_DB_APP_NAME: tachy-worker-heavy
      TACHY_DB_POOL_MAX: ${TACHY_WORKER_DB_POOL_MAX:-5}
      TACHY_DRAIN_SECONDS: "60"
      TACHY_TURN_SANDBOX: ${TACHY_TURN_SANDBOX:-on}
    mem_limit: ${TACHY_WORKER_HEAVY_MEM_LIMIT:-1536m}
    cpus: ${TACHY_WORKER_HEAVY_CPUS:-4}
    cpu_shares: 256

  # Starts the container each Claude Code run gets (§5.17): the only service
  # with the Docker socket, so it has no network and no app secret.
  sandbox-launcher:
    image: ${TACHY_IMAGE:-ghcr.io/diegokoes/tachy:main}
    container_name: ${COMPOSE_PROJECT_NAME:-tachy}-sandbox-launcher
    restart: unless-stopped
    command: ["node", "dist/launcher.js"]
    init: true
    network_mode: none
    group_add:
      - ${TACHY_DOCKER_GID:?set TACHY_DOCKER_GID (stat -c %g /var/run/docker.sock)}
    environment:
      NODE_ENV: production
      # A release runs the sandbox image built from its own commit.
      TACHY_SANDBOX_IMAGE: ${TACHY_SANDBOX_IMAGE:-ghcr.io/diegokoes/tachy:sandbox-sha-${TACHY_COMMIT:?set TACHY_SANDBOX_IMAGE or TACHY_COMMIT}}
      TACHY_SANDBOX_INSTANCE: ${COMPOSE_PROJECT_NAME:-tachy}
      TACHY_SANDBOX_NETWORK: ${COMPOSE_PROJECT_NAME:-tachy}-sandbox
      TACHY_SANDBOX_STATE_VOLUME: ${COMPOSE_PROJECT_NAME:-tachy}_tachy-agent-home
      # gVisor, which the host playbook installs; runc runs them without it.
      TACHY_SANDBOX_RUNTIME: ${TACHY_SANDBOX_RUNTIME:-runsc}
      # A chat turn takes two: Claude Code's and its tools'.
      TACHY_SANDBOX_MAX: ${TACHY_SANDBOX_MAX:-32}
      TACHY_SANDBOX_MEMORY_MB: ${TACHY_SANDBOX_MEMORY_MB:-512}
      TACHY_SANDBOX_CPUS: ${TACHY_SANDBOX_CPUS:-1}
      TACHY_SANDBOX_PIDS: ${TACHY_SANDBOX_PIDS:-256}
      # A turn's tools run this release's own image, on the database's network.
      TACHY_TOOLS_IMAGE: ${TACHY_IMAGE:-ghcr.io/diegokoes/tachy:main}
      TACHY_TOOLS_NETWORK: ${COMPOSE_PROJECT_NAME:-tachy}
      TACHY_TOOLS_REPO_VOLUME: ${COMPOSE_PROJECT_NAME:-tachy}_tachy-repo-data
      TACHY_TOOLS_MEMORY_MB: ${TACHY_TOOLS_MEMORY_MB:-512}
      TACHY_TOOLS_CPUS: ${TACHY_TOOLS_CPUS:-1}
      TACHY_TOOLS_PIDS: ${TACHY_TOOLS_PIDS:-256}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tachy-sandbox-run:/run/tachy-sandbox
    # Healthy once listening, which it does after pulling its image and
    # reaching the Docker socket. A probe that sends nothing is no request.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:net').connect('/run/tachy-sandbox/launcher.sock').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 120s
      start_interval: 2s
    mem_limit: ${TACHY_SANDBOX_LAUNCHER_MEM_LIMIT:-128m}
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    logging: *logging

  # The sandboxes' only way out, to the host:port pairs in TACHY_SANDBOX_EGRESS
  # (api.anthropic.com:443 when empty). It is on no network the database is.
  egress:
    image: ${TACHY_IMAGE:-ghcr.io/diegokoes/tachy:main}
    container_name: ${COMPOSE_PROJECT_NAME:-tachy}-egress
    restart: unless-stopped
    command: ["node", "dist/egress.js"]
    init: true
    environment:
      NODE_ENV: production
      TACHY_SANDBOX_EGRESS: ${TACHY_SANDBOX_EGRESS:-}
    networks: [sandbox, outbound]
    mem_limit: ${TACHY_EGRESS_MEM_LIMIT:-64m}
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      disable: true
    logging: *logging

  postgres:
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ${TACHY_POSTGRES_CONF:-./deploy/postgres/postgresql.conf}:/etc/postgresql/postgresql.conf:ro
    mem_limit: ${TACHY_POSTGRES_MEM_LIMIT:-2g}
    cpu_shares: 2048
    # One process per connection, plus the background and parallel workers.
    pids_limit: ${TACHY_POSTGRES_PIDS_LIMIT:-512}
    # What the image's entrypoint needs to own its data directory and step
    # down from root to postgres.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    logging: *logging

  # As tachy_app: sync, rotate-key and reembed need no more. `backup` and
  # `restore` here need the owner, passed for that one run with
  # -e DATABASE_URL=...; production backs up with tachy-backup instead.
  cli:
    init: true
    environment:
      DATABASE_URL: postgres://tachy_app:${TACHY_APP_DB_PASSWORD:?set TACHY_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-tachy}
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    logging: *logging

networks:
  # The sandboxes' network: it reaches the egress proxy and nothing else.
  sandbox:
    name: ${COMPOSE_PROJECT_NAME:-tachy}-sandbox
    internal: true
  outbound:
    name: ${COMPOSE_PROJECT_NAME:-tachy}-outbound

volumes:
  caddy-data:
  caddy-config:
  # The launcher's socket, which the api and the workers connect to.
  tachy-sandbox-run:
