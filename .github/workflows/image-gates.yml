name: Image gates

# What vitest cannot see: the built images themselves. The server image must
# start, answer readiness, pass smoke.js against seeded data, and do the same
# under the production overlay with one chat turn in a turn sandbox. Neither it
# nor the sandbox image may carry a critical vulnerability that already has a
# fix. Only pull requests that can change the images or the stack they start in
# pay for the build.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The path filter lives in a job, not under `on:`. A workflow that a path
  # filter skips leaves its check pending, which blocks a pull request once the
  # check is required; a job that a condition skips reports success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(Dockerfile|\.dockerignore|docker-compose\.yml|package\.json|package-lock\.json|packages/|db/|deploy/|load/|scripts/|\.github/workflows/image-gates\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  image-gates:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tachy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The stages it shares with the server image come from the build above.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: claude-sandbox
          load: true
          tags: tachy:ci-sandbox
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tachy:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the sandbox image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tachy:ci-sandbox
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start the stack
        id: stack
        run: scripts/container-smoke.sh up

      - name: Seed and smoke
        run: scripts/container-smoke.sh smoke

      # The stack a host runs: Caddy, the read-only root, the least-privilege
      # roles, the embedder and the workers, and one chat turn through them in
      # a turn sandbox.
      - name: Production overlay
        id: overlay
        run: scripts/container-smoke.sh prod

      - name: Logs
        if: failure() && steps.stack.outcome != 'skipped'
        run: |
          if [ "${{ steps.overlay.outcome }}" = skipped ]; then
            docker compose logs --tail 200
          else
            docker compose -f docker-compose.yml -f deploy/compose.prod.yml logs --tail 200
          fi
