name: Image gates

# What vitest cannot see: the built images themselves. The server image must
# start, answer readiness, pass smoke.js against seeded data, and do the same
# under the production overlay with one chat turn in a turn sandbox. Neither it
# nor the sandbox image may carry a critical vulnerability that already has a
# fix. Only pull requests that can change the images or the stack they start in
# pay for the build.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The path filter lives in a job, not under `on:`. A workflow that a path
  # filter skips leaves its check pending, which blocks a pull request once the
  # check is required; a job that a condition skips reports success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(Dockerfile|\.dockerignore|docker-compose\.yml|package\.json|package-lock\.json|packages/|db/|deploy/|load/|scripts/|\.github/workflows/image-gates\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  image-gates:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Nothing here runs the host scripts or the playbook: this is what can
      # be said about them without a host.
      - name: Lint the host scripts and the playbook
        run: |
          shellcheck -S warning -x -P deploy/host deploy/install.sh \
            deploy/host/common.sh deploy/host/tachy-install deploy/host/tachy-deploy \
            deploy/host/tachy-update deploy/backup/tachy-backup deploy/watch/tachy-watch
          command -v ansible-playbook >/dev/null || pipx install ansible-core
          ansible-playbook -i localhost, --syntax-check deploy/host/playbook.yml

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tachy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The stages it shares with the server image come from the build above.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: claude-sandbox
          load: true
          tags: tachy:ci-sandbox
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tachy:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan the sandbox image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tachy:ci-sandbox
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The turn sandboxes run under gVisor, from the release and with the
      # runtime settings the host playbook uses.
      - name: Install gVisor
        run: |
          vars=deploy/host/group_vars/all.yml
          release=$(sed -n 's/^gvisor_release: "\(.*\)"$/\1/p' "$vars")
          sha512=$(sed -n 's/^gvisor_sha512: "\(.*\)"$/\1/p' "$vars")
          curl -fsSL -o gvisor.tar.zstd \
            "https://storage.googleapis.com/gvisor/releases/release/$release/x86_64/gvisor.tar.zstd"
          echo "$sha512  gvisor.tar.zstd" | sha512sum -c -
          sudo mkdir -p "/usr/local/lib/gvisor/release-$release"
          sudo tar --zstd -xf gvisor.tar.zstd -C "/usr/local/lib/gvisor/release-$release"
          sudo ln -sf "/usr/local/lib/gvisor/release-$release/runsc" /usr/local/bin/runsc
          config=$( (sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}') |
            jq '.runtimes.runsc = {"path": "/usr/local/bin/runsc", "runtimeArgs": ["--network=host"]}')
          echo "$config" | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl reload docker
          # reload only sends SIGHUP; dockerd reads daemon.json after it returns
          for _ in $(seq 30); do
            docker info --format '{{range $name, $_ := .Runtimes}}{{$name}} {{end}}' | grep -qw runsc && exit 0
            sleep 1
          done
          echo "dockerd did not register the runsc runtime" >&2
          exit 1

      - name: Start the stack
        id: stack
        run: scripts/container-smoke.sh up

      - name: Seed and smoke
        run: scripts/container-smoke.sh smoke

      # The stack a host runs: Caddy, the read-only root, the least-privilege
      # roles, the embedder and the workers, and one chat turn through them in
      # turn sandboxes under gVisor.
      - name: Production overlay
        id: overlay
        run: scripts/container-smoke.sh prod

      - name: Logs
        if: failure() && steps.stack.outcome != 'skipped'
        run: |
          if [ "${{ steps.overlay.outcome }}" = skipped ]; then
            docker compose logs --tail 200
          else
            docker compose -f docker-compose.yml -f deploy/compose.prod.yml logs --tail 200
          fi
