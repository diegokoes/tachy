name: Image gates

# What vitest cannot see: the built image itself. It must start, answer
# readiness, pass smoke.js against seeded data, and carry no critical
# vulnerability that already has a fix. Only pull requests that can change the
# image or the stack it starts in pay for the build.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - package.json
      - package-lock.json
      - packages/**
      - db/**
      - load/**
      - scripts/**
      - .github/workflows/image-gates.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: tachy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tachy:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start the stack
        run: scripts/container-smoke.sh up

      - name: Seed and smoke
        run: scripts/container-smoke.sh smoke

      - name: Logs
        if: failure()
        run: docker compose logs --tail 200
