name: Image gates

# What vitest cannot see: the built image itself. It must start, answer
# readiness, pass smoke.js against seeded data, and carry no critical
# vulnerability that already has a fix. Only pull requests that can change the
# image or the stack it starts in pay for the build.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The path filter lives in a job, not under `on:`. A workflow that a path
  # filter skips leaves its check pending, which blocks a pull request once the
  # check is required; a job that a condition skips reports success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(Dockerfile|\.dockerignore|docker-compose\.yml|package\.json|package-lock\.json|packages/|db/|load/|scripts/|\.github/workflows/image-gates\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  image-gates:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tachy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tachy:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start the stack
        run: scripts/container-smoke.sh up

      - name: Seed and smoke
        run: scripts/container-smoke.sh smoke

      - name: Logs
        if: failure()
        run: docker compose logs --tail 200
