name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # `typecheck` excludes packages/web, which has its own tsconfig — this is
      # what holds the SPA to the shapes in @tachy/contract.
      - run: npm run web:check

      # The image spawns this bundle for every chat turn; a bundling error
      # should fail here, not in production.
      - run: npm run build:mcp

      # Every fork that touches knowledge or reference loads the embedding
      # model. Cached and warmed once here, they share the download instead of
      # racing for it; the key carries the model name so a swap re-fetches.
      - uses: actions/cache@v4
        with:
          path: .model-cache
          key: model-Xenova-bge-base-en-v1.5

      - run: npx tsx scripts/warmup-embeddings.ts

      # Tests start their own Postgres via Testcontainers; the GitHub-hosted
      # ubuntu runner has Docker preinstalled, so no service container needed.
      # `coverage` runs the same suite as `npm test` and adds the thresholds, so
      # running both would pay for the suite twice.
      - run: npm run coverage

  # Built once per commit that passed the tests, and pulled by digest on the
  # host; the host never builds. `dev` and `main` are convenience tags only.
  image:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/tachy" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: TACHY_COMMIT=${{ steps.name.outputs.short }}
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ steps.name.outputs.short }}
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the digest
        run: |
          ref="${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}"
          echo "$ref" > image-ref.txt
          echo "Image: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: image-ref
          path: image-ref.txt

  # The k6 scenarios need a live, seeded server, so they cannot run here. This
  # only bundles them: it catches a syntax error or a bad import in seconds.
  load-scripts:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Validate k6 scripts
        run: |
          for f in load/*.js; do
            docker run --rm -v "$PWD/load:/load:ro" grafana/k6:2.2.0 \
              archive "/load/$(basename "$f")" -O /dev/null
          done
