name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes to dev and main
# each get their own group, since every one of them publishes an image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history, so the pull request's base is there to diff against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # `typecheck` excludes packages/web, which has its own tsconfig - this is
      # what holds the SPA to the shapes in @tachy/contract.
      - run: npm run web:check

      - run: npm run comments:check

      # The image runs these bundles; a bundling error should fail here, not in
      # production.
      - run: npm run build:server

      # Every fork that touches knowledge or reference loads the embedding
      # model. Cached and warmed once here, they share the download instead of
      # racing for it; the key follows the model registry so a swap re-fetches.
      - uses: actions/cache@v6
        with:
          path: .model-cache
          key: model-${{ hashFiles('packages/core/src/search/model.ts') }}

      - run: npx tsx scripts/warmup-embeddings.ts

      # Tests start their own Postgres via Testcontainers; the GitHub-hosted
      # ubuntu runner has Docker preinstalled, so no service container needed.
      # `coverage` runs the same suite as `npm test` and adds the thresholds, so
      # running both would pay for the suite twice.
      - run: npm run coverage

      # The thresholds hold what each package already has. This holds what the
      # pull request adds: the share of its new lines the suite ran. A pull
      # request into main is a release of lines that each passed this on their
      # way into dev.
      - if: github.event_name == 'pull_request' && github.base_ref != 'main'
        run: npx tsx scripts/coverage-diff.ts

  # Built once per commit that passed the tests, and pulled by digest on the
  # host; the host never builds. `dev` and `main` are convenience tags only.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      # For the signed records below: the token asks Sigstore for a signing
      # certificate, and GitHub stores what was signed.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/tachy" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: TACHY_COMMIT=${{ steps.name.outputs.short }}
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ steps.name.outputs.short }}
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the digest
        run: |
          ref="${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}"
          echo "$ref" > image-ref.txt
          echo "Image: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: image-ref
          path: image-ref.txt

      - name: List what the image holds
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json

      # Signed statements kept beside the image: which workflow run built this
      # digest from which commit, and what it holds. Nothing verifies them yet:
      # `gh attestation verify oci://<image>@<digest> --repo <owner>/tachy` does.
      # A storage record is for organisation-owned repositories.
      - name: Attest where it was built
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest what it holds
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      # The pull request scanned a build of the same tree; this is the image a
      # host pulls, against what is known today.
      - name: Scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          range="HEAD"
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --log-opts="$range" .
