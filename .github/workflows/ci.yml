name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # for the backup/restore round-trip test
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run: npm run typecheck

      # `typecheck` excludes packages/web, which has its own tsconfig — this is
      # what holds the SPA to the shapes in @tachy/contract.
      - run: npm run web:check

      # Tests start their own Postgres via Testcontainers; the GitHub-hosted
      # ubuntu runner has Docker preinstalled, so no service container needed.
      - run: npm test

  # The k6 scenarios need a live, seeded server, so they cannot run here. This
  # only bundles them: it catches a syntax error or a bad import in seconds.
  load-scripts:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Validate k6 scripts
        run: |
          for f in load/*.js; do
            docker run --rm -v "$PWD/load:/load:ro" grafana/k6:latest \
              archive "/load/$(basename "$f")" -O /dev/null
          done
