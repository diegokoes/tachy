name: Load scripts

# The k6 scenarios need a live, seeded server, so they cannot run here. This
# only bundles them: it catches a syntax error or a bad import in seconds.
on:
  pull_request:
    paths:
      - load/**
      - .github/workflows/load-scripts.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate k6 scripts
        run: |
          k6=$(sed -n 's/^ *image: *\(grafana\/k6:[^ ]*\) *$/\1/p' load/k6.compose.yml)
          for f in $(grep -l '^export default' load/*.js); do
            docker run --rm -v "$PWD/load:/load:ro" "$k6" \
              archive "/load/$(basename "$f")" -O /dev/null
          done
