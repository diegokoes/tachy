name: Image cleanup

# Keeps the 60 newest tagged images: a commit has two, sha-* and
# sandbox-sha-*, so tachy-deploy can roll back 30 commits. Whatever dev and
# main currently point at is never deleted.
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what would be deleted
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: tachy
          keep-n-tagged: 60
          exclude-tags: dev,main,sandbox-dev,sandbox-main
          dry-run: ${{ inputs.dry-run == true }}
