version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # svelte-check cannot load TypeScript 7 yet: sveltejs/language-tools#3063
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: "docker-compose"
    directories: ["/", "/load"]
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      docker-compose:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
