networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-tachy}

services:
  postgres:
    # pg_trgm/pgcrypto/vector are all already present in this image -- no
    # postgresql-contrib needed (verified directly; see test/global-setup.ts,
    # which relies on the same fact for the test suite's Testcontainers DB).
    image: pgvector/pgvector:0.8.6-pg16
    container_name: ${COMPOSE_PROJECT_NAME:-tachy}-postgres
    restart: unless-stopped
    # Docker's default /dev/shm is 64MB. A parallel index build allocates its
    # whole maintenance_work_mem there, so rebuilding the HNSW/GIN indexes
    # (a large seed, a reembed) failed with "could not resize shared memory
    # segment ... No space left on device".
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tachy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tachy}
      POSTGRES_DB: ${POSTGRES_DB:-tachy}
      TACHY_APP_DB_PASSWORD: ${TACHY_APP_DB_PASSWORD:-}
      TACHY_BACKUP_DB_PASSWORD: ${TACHY_BACKUP_DB_PASSWORD:-}
    ports:
      # localhost-only: nothing on the office LAN needs raw Postgres access
      - "127.0.0.1:${TACHY_PG_PORT:-5433}:5432"
    volumes:
      - tachy-postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/roles.sql:/docker-entrypoint-initdb.d/20-roles.sql:ro
      - ./deploy/postgres/role-passwords.sh:/docker-entrypoint-initdb.d/30-role-passwords.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tachy} -d ${POSTGRES_DB:-tachy}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${TACHY_IMAGE:-diegokoes/tachy:latest}
    build:
      context: .
      args:
        TACHY_COMMIT: ${TACHY_COMMIT:-}
    container_name: ${COMPOSE_PROJECT_NAME:-tachy}-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tachy}:${POSTGRES_PASSWORD:-tachy}@postgres:5432/${POSTGRES_DB:-tachy}
      # `npm run sync seed` truncates. Its last-ditch refusal is this variable,
      # so the deployed database must always carry it.
      NODE_ENV: production
      TACHY_DB_APP_NAME: tachy-api
      TACHY_DB_POOL_MAX: "15"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TACHY_API_PORT:-8787}:8787"
    volumes:
      - ./backups:/app/backups
      # Linked-repo clones for code search — survives redeploys so reindexes
      # stay diff-only instead of re-cloning.
      - tachy-repo-data:/app/data
      # Per-user Claude Code state: one directory per user under users/<id>,
      # each holding that user's credential store and session transcripts.
      # Persisting it lets multi-turn chats resume across redeploys. The
      # server's own `claude login` no longer answers turns — users bring
      # their own credential, or fall back to ANTHROPIC_API_KEY /
      # CLAUDE_CODE_OAUTH_TOKEN from the environment.
      # Under /home/node, not /root: the container runs as an unprivileged user.
      - tachy-agent-home:/home/node/.claude

  # Not started by `up`. Run ad hoc, e.g.:
  #   docker compose run --rm cli npm run sync <source-slug>
  #   docker compose run --rm cli npm run sync backup
  #   docker compose run --rm cli npm run sync embed-backfill
  cli:
    # No `build:` — a second build definition for the same tag would race the
    # api's. `up -d --build` produces the image this runs on.
    image: ${TACHY_IMAGE:-diegokoes/tachy:latest}
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tachy}:${POSTGRES_PASSWORD:-tachy}@postgres:5432/${POSTGRES_DB:-tachy}
      # Overridable because `seed` runs through this service, and the dev stack
      # is meant to be seeded. The dev .env sets NODE_ENV=development; a stack
      # that says nothing gets the refusal.
      NODE_ENV: ${NODE_ENV:-production}
      TACHY_DB_APP_NAME: tachy-cli
      TACHY_DB_POOL_MAX: "5"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
      - tachy-repo-data:/app/data

volumes:
  tachy-postgres-data:
  tachy-repo-data:
  tachy-agent-home:
