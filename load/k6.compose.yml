# Not started by `up`: run ad hoc, the same way the `cli` service is:
#   npm run load -- /load/smoke.js
services:
  k6:
    # The one pin besides the Dockerfile's. tachy-deploy, container-smoke.sh
    # and the load-scripts workflow read the image from this line.
    image: grafana/k6:2.3.0
    profiles: ["load"]
    environment:
      BASE_URL: ${BASE_URL:-http://api:8787}
      LOGIN_EMAIL: ${LOGIN_EMAIL:-dev-member@tachy.local}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-tachy-dev-password}
      PROFILE: ${PROFILE:-}
      RATE: ${RATE:-}
      DURATION: ${DURATION:-}
    volumes:
      # Mounted rather than piped on stdin: the scenarios import session.js and corpus.js.
      - ./load:/load:ro
